<title>UnitSafe Pharmaceuticals | Metformin batch details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#f7f7f7; --card:#ffffff; --ink:#0d2340; --muted:#5b6b80; --line:#e6ebf1;
  --blue:#1f56d6; --green:#23906a; --tint:#eef6f2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Figtree",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:0 24px}
.hero{text-align:center;padding:32px 0 8px}
.hero img{width:min(340px,80vw);height:auto;display:block;margin:0 auto}
.product{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:40px;margin:16px 0 0;box-shadow:0 1px 2px rgba(13,35,64,.04),0 12px 40px rgba(13,35,64,.05)}
.top{display:flex;align-items:center;gap:32px;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(28px,4.4vw,40px);line-height:1.15;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);font-size:17px}
.dose{display:flex;align-items:center;gap:18px}
.tablet{width:72px;height:72px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 35% 30%,#ffffff,#eceff3 70%);
  box-shadow:inset 0 -4px 8px rgba(13,35,64,.08),0 6px 16px rgba(13,35,64,.12)}
.tablet::after{content:"";position:absolute;left:14px;right:14px;top:50%;height:3px;border-radius:2px;
  background:#cfd6df;transform:rotate(-38deg)}
.dose b{display:block;font-size:44px;line-height:1;font-weight:700;color:var(--blue);letter-spacing:-.02em}
.dose b span{font-size:22px;font-weight:600;margin-left:4px;color:var(--ink)}
.dose small{color:var(--muted);font-size:14px}
dl{display:grid;grid-template-columns:repeat(2,1fr);gap:0 40px;margin:32px 0 0}
.row{padding:18px 0;border-top:1px solid var(--line)}
dt{color:var(--muted);font-size:14px;margin-bottom:2px}
dd{margin:0;font-size:20px;font-weight:600}
.status{margin-top:8px;display:inline-flex;align-items:center;gap:8px;background:var(--tint);color:var(--green);
  font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--green);display:block}
.status.expired{background:#fdf0f0;color:#b3312f}.status.expired i{background:#b3312f}
footer{padding:32px 0 48px;color:var(--muted);font-size:14px;text-align:center}
@media (max-width:640px){
  .product{padding:26px 22px;border-radius:16px}
  dl{grid-template-columns:1fr}
  .dose b{font-size:38px}
}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
</style>
</head>

(function(){
  function fmt(iso){
    var p=iso.split("-"),d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
    return d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
  }
  var b=document.getElementById("batch");b.textContent=b.dataset.value;
  var m=document.getElementById("mfg");m.textContent=fmt(m.dataset.date);
  var e=document.getElementById("exp");e.textContent=fmt(e.dataset.date);
  var today=new Date(),t=Date.UTC(today.getFullYear(),today.getMonth(),today.getDate());
  var p=e.dataset.date.split("-"),x=Date.UTC(+p[0],+p[1]-1,+p[2]);
  var s=document.getElementById("status"),txt=document.getElementById("stxt");
  if(t>x){s.classList.add("expired");txt.textContent="Expired"}else{txt.textContent="Within shelf life"}
})();
</script>
</body>
</html>
